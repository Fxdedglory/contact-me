<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Tim Sellwood | Data Engineer</title>

  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f6f7fb; }
    .wrap { max-width: 760px; margin: 48px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border: 1px solid #e6e7ee;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 18px; color: #444; line-height: 1.5; }
    .highlight { color: #2f5cff; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .row { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; color: #333; }
    .req { color: #d32f2f; margin-left: 4px; font-weight: 700; }

    input, select {
      padding: 11px 12px;
      border: 1px solid #cfd3e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #2f5cff;
      box-shadow: 0 0 0 3px rgba(47,92,255,.15);
    }

    .actions { margin-top: 20px; display: flex; gap: 12px; align-items: center; }
    input[type="submit"] {
      border: 0;
      background: #2f5cff;
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    .hint { font-size: 12px; color: #666; }
    .full { grid-column: 1 / -1; }
    .error {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #f1c0c0;
      background: #fff2f2;
      color: #7a1f1f;
      border-radius: 10px;
      font-size: 13px;
    }
    .hp { position: absolute; left: -10000px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Connect with Tim Sellwood</h1>
      <p>
        Interested in discussing a <span class="highlight">Data Engineering, Analytics, or AI role</span>?
        Fill out the form below and you’ll receive my resume and calendar availability instantly.
      </p>

      <form
        id="w2lForm"
        action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DgK00000JpT1w"
        method="POST"
        novalidate
      >
        <!-- REQUIRED -->
        <input type="hidden" name="oid" value="00DgK00000JpT1w" />
        <input type="hidden" name="retURL" value="https://fxdedglory.github.io/contact-me/thank-you.html" />

        <!-- CRM Tracking -->
        <input type="hidden" name="lead_source" value="Web" />
        <input type="hidden" name="description" id="description" value="" />

        <!-- Honeypot (spam protection) -->
        <div class="hp">
          <input id="company_fax" name="company_fax" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <div class="grid">
          <div class="row">
            <label>First Name<span class="req">*</span></label>
            <input id="first_name" name="first_name" type="text" required />
          </div>

          <div class="row">
            <label>Last Name<span class="req">*</span></label>
            <input id="last_name" name="last_name" type="text" required />
          </div>

          <div class="row">
            <label>Email</label>
            <input id="email" name="email" type="email" />
          </div>

          <div class="row">
            <label>Phone</label>
            <input id="phone" name="phone" type="tel" />
          </div>

          <div class="row full">
            <label>Company / Organization</label>
            <input id="company" name="company" type="text" placeholder="Optional (auto-filled if blank)" />
          </div>

          <div class="row full">
            <label>Message (Optional)</label>
            <input id="city" name="city" type="text" placeholder="Role, company, or context (e.g. Data Engineer role)" />
          </div>
        </div>

        <div id="formError" class="error"></div>

        <div class="actions">
          <input type="submit" value="Send & Receive Resume + Calendar" />
          <span class="hint">You’ll receive an automated email with resume & scheduling link.</span>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("w2lForm");
      const hp = document.getElementById("company_fax");
      const desc = document.getElementById("description");
      const err = document.getElementById("formError");

      const first = document.getElementById("first_name");
      const last = document.getElementById("last_name");
      const email = document.getElementById("email");
      const phone = document.getElementById("phone");
      const company = document.getElementById("company");

      function isBlank(v){ return !v || v.trim() === ""; }

      form.addEventListener("submit", function(e){
        err.style.display = "none";

        if (hp.value.trim() !== "") {
          e.preventDefault();
          return;
        }

        if (isBlank(first.value) || isBlank(last.value)) {
          e.preventDefault();
          err.textContent = "First and Last Name are required.";
          err.style.display = "block";
          return;
        }

        if (isBlank(email.value) && isBlank(phone.value)) {
          e.preventDefault();
          err.textContent = "Please provide either Email or Phone.";
          err.style.display = "block";
          return;
        }

        if (isBlank(company.value)) {
          company.value = "Portfolio Lead";
        }

        desc.value =
          "PORTFOLIO_LEAD | domain=teemails.com | page=github_pages | submitted_at=" +
          new Date().toISOString();
      });
    })();
  </script>
</body>
</html>
