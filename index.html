<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Tim Sellwood</title>

  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f6f7fb; }
    .wrap { max-width: 760px; margin: 40px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border: 1px solid #e6e7ee;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #444; line-height: 1.5; font-size: 14px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row { display: flex; flex-direction: column; gap: 6px; }
    .full { grid-column: 1 / -1; }

    label { font-size: 13px; color: #222; }
    .req { color: #d32f2f; margin-left: 4px; font-weight: 700; }

    input {
      padding: 10px 12px;
      border: 1px solid #cfd3e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #2f5cff;
      box-shadow: 0 0 0 3px rgba(47,92,255,.12);
    }

    .actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button[type="submit"] {
      border: 0;
      background: #2f5cff;
      color: #fff;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .hint { font-size: 12px; color: #666; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #f1c0c0;
      background: #fff2f2;
      color: #7a1f1f;
      border-radius: 8px;
      font-size: 13px;
    }

    /* Honeypot */
    .hp { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }

    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Contact Tim Sellwood</h1>
      <p>
        Fill out the form below. You’ll be redirected to a confirmation page after submission.
      </p>

      <!--
        DEBUG MODE (use temporarily while testing):
        Add: ?debug=1&debugEmail=YOUR_EMAIL to the action URL.
        Example:
        action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&debug=1&debugEmail=tesellwood5230@gmail.com"
        This will show the exact reason Salesforce rejected the Lead.
      -->

      <form
        id="w2lForm"
        action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8"
        method="POST"
        novalidate
      >
        <!-- REQUIRED by Salesforce -->
        <input type="hidden" name="oid" value="00DgL00000LB62n">
        <input type="hidden" name="retURL" value="https://fxdedglory.github.io/contact-me/thank-you.html" />

        <!-- Tracking / defaults -->
        <input type="hidden" name="lead_source" value="Web" />
        <input type="hidden" name="description" id="description" value="" />

        <!-- OPTIONAL: If you use an assignment rule and need to force it -->
        <!-- <input type="hidden" name="assign" value="1" /> -->

        <!-- Honeypot (spam protection). Bots fill this; humans won't. -->
        <div class="hp" aria-hidden="true">
          <label for="company_fax">Company Fax</label>
          <input id="company_fax" name="company_fax" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <div class="grid">
          <div class="row">
            <label for="first_name">First Name<span class="req">*</span></label>
            <input id="first_name" name="first_name" type="text" required autocomplete="given-name" />
          </div>

          <div class="row">
            <label for="last_name">Last Name<span class="req">*</span></label>
            <input id="last_name" name="last_name" type="text" required autocomplete="family-name" />
          </div>

          <div class="row">
            <label for="email">Email<span class="req">*</span></label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>

          <div class="row">
            <label for="phone">Phone (Optional)</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" />
          </div>

          <div class="row full">
            <label for="company">Company / Organization (Optional)</label>
            <input id="company" name="company" type="text" placeholder="If blank, defaults to Portfolio Lead" />
          </div>

          <div class="row full">
            <!-- Using the standard Lead City field as your “message” is confusing.
                 If you want a message field, ideally create a custom Lead field (e.g., Message__c).
                 For now, we'll keep your existing behavior but label it clearly. -->
            <label for="city">Message (Optional)</label>
            <input id="city" name="city" type="text" placeholder="Role, company, or context" />
          </div>
        </div>

        <div id="formError" class="error"></div>

        <div class="actions">
          <button type="submit">Submit</button>
          <span class="hint">Fields marked with * are required.</span>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("w2lForm");
      const hp = document.getElementById("company_fax");
      const desc = document.getElementById("description");
      const err = document.getElementById("formError");

      const first = document.getElementById("first_name");
      const last = document.getElementById("last_name");
      const email = document.getElementById("email");
      const company = document.getElementById("company");

      function isBlank(v) { return !v || v.trim() === ""; }

      form.addEventListener("submit", function (e) {
        err.style.display = "none";
        err.textContent = "";

        // Honeypot
        if (hp.value.trim() !== "") {
          e.preventDefault();
          return;
        }

        // Required checks
        if (isBlank(first.value) || isBlank(last.value) || isBlank(email.value)) {
          e.preventDefault();
          err.textContent = "First Name, Last Name, and Email are required.";
          err.style.display = "block";
          return;
        }

        // Salesforce Lead Company is required.
        if (isBlank(company.value)) {
          company.value = "Portfolio Lead";
        }

        // Helpful description for triage
        const payload = {
          tag: "PORTFOLIO_LEAD",
          domain: "teemails.com",
          page: "github_pages",
          submitted_at: new Date().toISOString()
        };
        desc.value = `${payload.tag} | domain=${payload.domain} | page=${payload.page} | submitted_at=${payload.submitted_at}`;
      });
    })();
  </script>
</body>
</html>
