<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You</title>

  <!-- Auto redirect after 4 seconds -->
  <meta http-equiv="refresh" content="4;url=https://www.linkedin.com/in/tesellwood" />

  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { margin: 0; background: #f6f7fb; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card {
      background: #fff;
      border: 1px solid #e6e7ee;
      border-radius: 14px;
      padding: 32px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
    }
    h1 { margin-bottom: 12px; }
    p { color: #444; margin-bottom: 18px; }
    a {
      display: inline-block;
      background: #2f5cff;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
    .small { margin-top: 12px; font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank You — Your Info Was Submitted</h1>
    <p>Your submission has been successfully received and logged in our CRM.</p>

    <p>You’ll be redirected to LinkedIn shortly.</p>

    <a href="https://www.linkedin.com/in/tesellwood">
      Go to LinkedIn Now
    </a>

    <div class="small">
      Redirecting automatically in 4 seconds...
    </div>
  </div>

  <script>
    // Backup JS redirect (in case meta refresh is blocked)
    setTimeout(function() {
      window.location.href = "https://www.linkedin.com/in/tesellwood";
    }, 4000);
  </script>
</body>
</html>
