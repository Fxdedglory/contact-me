<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You</title>

  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body {
      margin: 0;
      background: #f6f7fb;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e6e7ee;
      border-radius: 12px;
      padding: 22px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 8px 18px rgba(0,0,0,.06);
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 10px; color: #444; line-height: 1.5; font-size: 14px; }
    a {
      display: inline-block;
      margin-top: 10px;
      color: #2f5cff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Thank you</h1>
    <p>Your submission was received.</p>
    <p>If you don’t receive an email shortly, you can also schedule directly here:</p>
    <a href="https://calendly.com/sellwood-timm/30min">Schedule a meeting</a>
  </div>
</body>
</html>
